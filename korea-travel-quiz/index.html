<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>韓国観光クイズ - Korea Travel Quiz</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b1329;
      --card-bg: #141f3d;
      --card-border: #223561;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #f43f5e;
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.15);
      --correct-border: #10b981;
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.15);
      --wrong-border: #ef4444;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1a2c5a 0%, var(--bg) 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    /* Progress & Score bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .status-bar strong {
      color: var(--text);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #ec4899);
      border-radius: 9999px;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Question */
    .question-box {
      margin-bottom: 24px;
    }

    .question-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f43f5e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
      color: #ffffff;
    }

    /* Options */
    .options-grid {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: #3b82f6;
      transform: translateY(-1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: #34d399;
    }
    .option-btn.correct .option-num {
      background: var(--correct);
      color: #064e3b;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: #f87171;
    }
    .option-btn.wrong .option-num {
      background: var(--wrong);
      color: #7f1d1d;
    }

    /* Explanation Banner */
    .feedback-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .feedback-box.wrong {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .feedback-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feedback-title.correct { color: #34d399; }
    .feedback-title.wrong { color: #f87171; }

    .feedback-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Action button */
    .action-btn {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: var(--primary-hover);
    }

    /* Result Screen */
    .result-screen {
      text-align: center;
      display: none;
    }

    .result-badge {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .result-score {
      font-size: 2.2rem;
      font-weight: 800;
      color: #60a5fa;
      margin: 16px 0;
    }

    .result-comment {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="badge">🇰🇷 展示デモ</div>
      <h1>韓国観光クイズ</h1>
      <p class="subtitle">定番スポットからグルメまで！あなたの韓国旅行知識をチェック</p>
    </header>

    <main class="card" id="quizCard">
      <!-- Quiz Screen -->
      <div id="quizScreen">
        <div class="status-bar">
          <span>問題 <strong id="currentQuestionNum">1</strong> / <span id="totalQuestionsNum">5</span></span>
          <span>スコア: <strong id="scoreDisplay">0</strong>点</span>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="progressBar" style="width: 20%;"></div>
        </div>

        <div class="question-box">
          <div class="question-tag" id="questionCategory">観光スポット</div>
          <div class="question-text" id="questionText">読み込み中...</div>
        </div>

        <div class="options-grid" id="optionsContainer">
          <!-- Options dynamically rendered here -->
        </div>

        <div class="feedback-box" id="feedbackBox">
          <div class="feedback-title" id="feedbackTitle"></div>
          <div class="feedback-desc" id="feedbackDesc"></div>
        </div>

        <button class="action-btn" id="nextBtn" style="display: none;">
          次の問題へ進む ➔
        </button>
      </div>

      <!-- Result Screen -->
      <div class="result-screen" id="resultScreen">
        <div class="result-badge" id="resultIcon">🎉</div>
        <h2 class="result-title" id="resultTitle">クイズ終了！</h2>
        <div class="result-score" id="finalScore">0 / 5 問正解</div>
        <p class="result-comment" id="resultComment"></p>
        <button class="action-btn" id="retryBtn">
          もう一度挑戦する 🔄
        </button>
      </div>
    </main>

    <footer class="footer">
      <span>サンプルデータで動作中 • インストール不要のローカル実行Webアプリ</span>
    </footer>
  </div>

  <script>
    const quizData = [
      {
        category: "ランドマーク",
        question: "ソウルの象徴的なランドマークで、南山（ナムサン）の山頂に立ち夜景スポットとしても有名なタワーは？",
        options: ["ロッテワールドタワー", "Nソウルタワー", "63ビル", "釜山タワー"],
        answer: 1,
        explanation: "「Nソウルタワー」は南山の頂上にあるソウルのシンボルで、ソウル市内を360度見渡せる人気の観光地です。"
      },
      {
        category: "基本情報",
        question: "韓国旅行で使われる現地通貨の単位は次のうちどれ？",
        options: ["ドン (VND)", "バーツ (THB)", "ウォン (KRW)", "ペソ (PHP)"],
        answer: 2,
        explanation: "韓国の通貨は「ウォン（₩ / KRW）」です。1,000ウォン＝約110円前後で換算されることが多いです。"
      },
      {
        category: "歴史・文化",
        question: "朝鮮王朝の正宮として1395年に創建され、韓服（チマチョゴリ）を着て訪れると入場無料になる古宮は？",
        options: ["景福宮（キョンボックン）", "昌徳宮（チャンドックン）", "徳寿宮（トクスグン）", "宗廟（チョンミョ）"],
        answer: 0,
        explanation: "「景福宮」はソウル最大の古宮で、衛兵交代式（守門将交代儀式）なども見どころの人気スポットです。"
      },
      {
        category: "グルメ・ショッピング",
        question: "屋台グルメの食べ歩きやコスメショップで賑わう、ソウルで最も代表的な繁華街はどこ？",
        options: ["弘大（ホンデ）", "仁寺洞（インサドン）", "明洞（ミョンドン）", "東大門（トンデムン）"],
        answer: 2,
        explanation: "「明洞」は多くの屋台や免税店、コスメ店が集まり、旅行者が必ず一度は訪れる定番ストリートです。"
      },
      {
        category: "都市・リゾート",
        question: "海雲台（ヘウンデ）ビーチや新鮮な海鮮料理で有名な、韓国第2の港湾都市はどこ？",
        options: ["大邱（テグ）", "釜山（プサン）", "仁川（インチョン）", "光州（クァンジュ）"],
        answer: 1,
        explanation: "「釜山（プサン）」は韓国南東部にある港町で、リゾート感あふれる海雲台ビーチやチャガルチ市場が有名です。"
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    // DOM Elements
    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("resultScreen");
    const currentQuestionNumEl = document.getElementById("currentQuestionNum");
    const totalQuestionsNumEl = document.getElementById("totalQuestionsNum");
    const scoreDisplayEl = document.getElementById("scoreDisplay");
    const progressBarEl = document.getElementById("progressBar");
    const questionCategoryEl = document.getElementById("questionCategory");
    const questionTextEl = document.getElementById("questionText");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const feedbackBoxEl = document.getElementById("feedbackBox");
    const feedbackTitleEl = document.getElementById("feedbackTitle");
    const feedbackDescEl = document.getElementById("feedbackDesc");
    const nextBtnEl = document.getElementById("nextBtn");
    const retryBtnEl = document.getElementById("retryBtn");
    const finalScoreEl = document.getElementById("finalScore");
    const resultTitleEl = document.getElementById("resultTitle");
    const resultCommentEl = document.getElementById("resultComment");
    const resultIconEl = document.getElementById("resultIcon");

    function initQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      answered = false;
      totalQuestionsNumEl.textContent = quizData.length;
      quizScreen.style.display = "block";
      resultScreen.style.display = "none";
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      const q = quizData[currentQuestionIndex];

      currentQuestionNumEl.textContent = currentQuestionIndex + 1;
      scoreDisplayEl.textContent = score * 20;
      progressBarEl.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;
      
      questionCategoryEl.textContent = q.category;
      questionTextEl.textContent = q.question;

      // Hide feedback and next button
      feedbackBoxEl.className = "feedback-box";
      feedbackBoxEl.style.display = "none";
      nextBtnEl.style.display = "none";

      // Render options
      optionsContainerEl.innerHTML = "";
      q.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `<span class="option-num">${idx + 1}</span><span>${optText}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainerEl.appendChild(btn);
      });
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = quizData[currentQuestionIndex];
      const buttons = optionsContainerEl.querySelectorAll(".option-btn");

      buttons.forEach(btn => btn.disabled = true);

      const isCorrect = (selectedIdx === q.answer);
      if (isCorrect) {
        score++;
        buttons[selectedIdx].classList.add("correct");
        feedbackTitleEl.textContent = "正解！ ⭕️";
        feedbackTitleEl.className = "feedback-title correct";
        feedbackBoxEl.className = "feedback-box show correct";
      } else {
        buttons[selectedIdx].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        feedbackTitleEl.textContent = "不正解... ❌";
        feedbackTitleEl.className = "feedback-title wrong";
        feedbackBoxEl.className = "feedback-box show wrong";
      }

      scoreDisplayEl.textContent = score * 20;
      feedbackDescEl.textContent = q.explanation;
      feedbackBoxEl.style.display = "block";

      if (currentQuestionIndex < quizData.length - 1) {
        nextBtnEl.textContent = "次の問題へ進む ➔";
      } else {
        nextBtnEl.textContent = "結果を見る 🏆";
      }
      nextBtnEl.style.display = "flex";
    }

    nextBtnEl.onclick = () => {
      if (currentQuestionIndex < quizData.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizScreen.style.display = "none";
      resultScreen.style.display = "block";

      const total = quizData.length;
      finalScoreEl.textContent = `${total}問中 ${score}問 正解 (${score * 20}点)`;

      if (score === 5) {
        resultIconEl.textContent = "👑";
        resultTitleEl.textContent = "完璧！韓国観光マスター！";
        resultCommentEl.textContent = "全問正解です！韓国の観光地、文化、グルメにとても詳しいですね。次の韓国旅行も満喫間違いなしです！";
      } else if (score >= 3) {
        resultIconEl.textContent = "✨";
        resultTitleEl.textContent = "素晴らしい！韓国ツウです！";
        resultCommentEl.textContent = "主要な観光ポイントをしっかり押さえています。さらに深掘りして穴場スポットも巡ってみましょう！";
      } else {
        resultIconEl.textContent = "✈️";
        resultTitleEl.textContent = "これからが楽しみ！";
        resultCommentEl.textContent = "これから韓国旅行の魅力をたくさん知っていきましょう！もう一度復習してみませんか？";
      }
    }

    retryBtnEl.onclick = initQuiz;

    // Start
    initQuiz();
  </script>
</body>
</html>
